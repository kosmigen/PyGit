<svg xmlns="http://www.w3.org/2000/svg" width="270" height="180" viewBox="0 0 270 180" role="img" aria-labelledby="title desc">
  <title id="title">PyGit</title>
  <desc id="desc">Two paths of commit nodes join into one history, illustrating version control.</desc>
  <rect width="270" height="180" rx="3" fill="#182d3b"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="4">
    <path d="M60 137V43" stroke="#edf1ed"/>
    <path d="M60 118C60 82 120 98 120 62V43" stroke="#6caeb1"/>
    <path d="M120 62C120 102 180 82 180 118V137" stroke="#e9aa72"/>
  </g>
  <g fill="#182d3b" stroke-width="4">
    <circle cx="60" cy="137" r="8" stroke="#edf1ed"/>
    <circle cx="60" cy="90" r="8" stroke="#edf1ed"/>
    <circle cx="60" cy="43" r="8" stroke="#edf1ed"/>
    <circle cx="120" cy="43" r="8" stroke="#6caeb1"/>
    <circle cx="180" cy="137" r="8" stroke="#e9aa72"/>
  </g>
  <g stroke="#8ba0ac" stroke-linecap="round" stroke-width="3">
