# 网站标题、描述和主题可以直接在这里修改。
title: Let's Build A Simple Git
description: Write the Git core implementation from scratch using Python.
lang: zh-CN
theme: jekyll-theme-minimal
show_downloads: false

# 左侧的系列介绍组件。文案和阅读入口都可以在这里直接修改。
series:
  title: Build Your Own X From Scratch
  description: "What I cannot create, I do not understand. — Richard Feynman"
  image: /assets/images/wheels-workbench.png
  image_alt: 木工台上的木质轮子、黄铜轴和绘图工具
  link_text: More Projects
  url: /wheels/

# 对应当前仓库 https://github.com/kosmigen/PyGit。
# 如果仓库改名或转移，请同步修改下面的地址。
url: "https://kosmigen.github.io"
baseurl: "/PyGit"
repository: kosmigen/PyGit
edit_base_url: "https://github.com/kosmigen/PyGit/edit/main/docs/"

plugins:
  - jekyll-seo-tag
  - jekyll-github-metadata

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: documentation

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
