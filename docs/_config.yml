# 网站标题、描述和主题可以直接在这里修改。
title: PyGit
description: 用 Python 理解 Git：从对象存储到版本控制。
lang: zh-CN
theme: jekyll-theme-minimal
show_downloads: false

# 左侧的系列介绍组件。文案和阅读入口都可以在这里直接修改。
series:
  label: BUILD FROM SCRATCH
  title: 从零造轮子
  subject: 用 Python 写一个 Git
  description: 亲手实现 Git 的核心机制，记录从零搭建的过程。
  meta: Python · Version control
  link_text: 阅读系列
  url: /#chapters

# 对应当前仓库 https://github.com/kosmigen/PyGit。
# 如果仓库改名或转移，请同步修改下面的地址。
url: "https://kosmigen.github.io"
baseurl: "/PyGit"
repository: kosmigen/PyGit
edit_base_url: "https://github.com/kosmigen/PyGit/edit/main/docs/"

plugins:
  - jekyll-seo-tag
  - jekyll-github-metadata

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: documentation

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
