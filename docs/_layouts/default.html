<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <div class="wrapper">
      <header class="site-header">
        {% if page.url == '/' %}
        <img class="site-logo" src="{{ '/assets/images/pygit.svg' | relative_url }}" alt="PyGit 提交历史示意图" width="270" height="180">
        {% endif %}
        <h1>{{ site.title | escape }}</h1>
        <p>{{ site.description | escape }}</p>
        {% include navigation.html %}
        {% include series-card.html %}
      </header>
      <section class="doc-content" id="content" aria-label="文章正文">
        {{ content }}
      </section>
      <footer class="site-footer">
        <p>Maintained by kosmigen.</p>
        <p><small>Hosted on GitHub Pages &mdash; Theme by orderedlist</small></p>
      </footer>
    </div>
  </body>
</html>
