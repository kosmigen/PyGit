{% if site.series %}
<wa-card class="series-card" aria-label="{{ site.series.title | escape }}">
  <strong slot="header">{{ site.series.title | escape }}</strong>
  {{ site.series.subject | escape }}<br><br>
  {{ site.series.description | escape }}
  <wa-button slot="footer" variant="neutral" appearance="outlined" size="s" href="{{ site.series.url | relative_url | escape }}">{{ site.series.link_text | escape }}</wa-button>
</wa-card>
{% endif %}
